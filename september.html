<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>September — for my love</title>
  <link rel="stylesheet" href="september.css" />
</head>
<body>
  <main class="month-shell">
    <header class="month-header">
      <a class="back-link" href="index.html">← months</a>
      <div class="month-title">
        <h1>september.</h1>
        <p>the road after the storm.</p>
      </div>
    </header>

    <div class="month-layout">
      <aside class="theme-panel" aria-label="september decoration">
        <div class="scrap-card" aria-hidden="true">
          <span class="tape tape-a"></span>
          <span class="tape tape-b"></span>
          <div class="route-mark">
            <i></i><i></i><i></i>
          </div>
          <strong>september.</strong>
          <small>the road after the storm.</small>
        </div>
        <div class="mailbox" aria-hidden="true">
          <div class="mailbox-post"></div>
          <div class="mailbox-box"><div class="mailbox-slot"></div><div class="mailbox-door"></div></div>
          <div class="mailbox-flag"></div>
        </div>
      </aside>

      <section class="day-pane">
        <div class="day-list" id="dayList" aria-label="september entries"></div>
      </section>
    </div>
  </main>

  <div class="reader-overlay" id="readerOverlay" aria-hidden="true">
    <button class="reader-close" id="readerClose" type="button" aria-label="close story">×</button>

    <div class="book-stage">
      <button class="closed-book" id="closedBook" type="button" aria-label="open storybook">
        <span>for my love.</span>
        <small>tap to open.</small>
      </button>

      <div class="book-spread">
        <div class="book-cover"></div>
        <div class="ribbon"></div>
        <div class="spine"></div>

        <div class="spread">
          <aside class="book-page left-page">
            <span class="entry-label" id="entryLabel">entry 01</span>
            <h2 class="entry-date" id="entryDate">sep. 1.</h2>
            <div class="route-art" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
          </aside>

          <section class="book-page right-page" id="rightPage">
            <div class="mobile-story-header">
              <small id="mobileEntry">entry 01</small>
              <strong id="mobileDate">sep. 1.</strong>
            </div>

            <div class="story-body" id="storyBody"></div>

            <button class="page-back" id="pageBack" type="button" aria-label="previous page">←</button>
            <div class="reader-footer">
              <div class="reader-meta">
                <span id="pageCount">1 / 1</span>
                <span id="pageHint">tap the page →</span>
              </div>
              <div class="reader-track"><span id="pageProgress"></span></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="september-data.js"></script>
  <script src="september.js"></script>
</body>
</html>
