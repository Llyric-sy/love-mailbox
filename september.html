<script>
const STORIES={
1:[`The storm had been following the travelling party since midday, although at first it had seemed like the sort of weather that would pass if everyone simply kept moving. By evening the road had vanished beneath running water, the horses had become difficult to manage, and every cloak in the group was soaked through. They reached an old roadside wayhouse shortly before dark and crowded inside with little concern for comfort. The roof leaked in one corner, several windows had been boarded shut, and there were fewer chairs than people, but it was dry enough to feel luxurious after the road outside.`,`One of the travellers arrived a little later than the rest and paused near the doorway, looking for somewhere to put their things. Another traveller, already seated near the wall, shifted a pack aside and made a little room. They exchanged names and spoke briefly about the storm, the damaged road and how long the delay might last. The conversation was ordinary and soon disappeared into the noise of the room as both returned to the people they already knew.`,`By morning, neither gave the exchange much thought. The road remained closed, the rain continued, and the wayhouse began filling with the routines of people who had expected to stay only one night. Among all of them were two travellers who had spoken once and had no reason yet to believe they would become anything more than familiar faces encountered along the same road.`],
2:[`The wayhouse keeper believed that anyone stranded beneath his roof could at least help keep the place standing. After breakfast he began handing out small jobs. Some people were sent to the stables, others to the roof, and the two travellers from the previous evening were given an old lantern that had not worked for years.`,`The lantern was in worse condition than it first appeared. Its frame had been bent, the wick had burned almost completely away, and one piece of glass no longer sat properly in its groove. One traveller understood enough about lamps to take apart the burner and replace the wick. The other had steadier hands for straightening the frame and fitting the loose pieces back together. Their work was interrupted by mistakes, mild disagreement and several moments where neither knew what a particular piece was supposed to do, but eventually the lantern caught and held a clean flame.`,`The task had taken most of the morning. Once it was done, they carried the lantern to the keeper and returned to different parts of the wayhouse. That evening it hung beside the entrance, casting a warm circle of light over wet boots and travelling packs. Neither considered the repair especially important. It was simply the first ordinary thing they had managed together.`],
3:[`While checking their supplies, one traveller discovered that the leather loop holding a bedroll to their pack had nearly torn away. String snapped under the weight, and the remaining leather was too short to knot securely. Across the room, the other traveller was sorting through a small collection of tools and miscellaneous objects gathered over many journeys. Among them was a plain brass hook, worn smooth at the edges and worth very little.`,`The broken pack needed exactly that shape. The traveller offered a trade and produced a silver compass in return. The casing was finely made, the glass almost unscratched, and even from a distance it was obvious that the compass was worth far more than the hook. A few people nearby laughed when they saw the exchange being proposed. The owner of the hook hesitated as well, pointing out that the trade made no sense.`,`“For you, maybe,” the other traveller said, already testing the hook against the torn strap. “I need this.”`,`The exchange went ahead. The brass hook held the bedroll perfectly, and the silver compass found a new place in the other traveller’s pocket. The jokes continued for the rest of the afternoon, but both people involved were satisfied. The value of the objects had mattered much less than whether either of them had what they actually needed.`],
4:[`Once the rain eased, the wayhouse keeper sent several people into the surrounding hills to gather edible herbs and anything else the kitchen could use. The two travellers ended up taking the same route. What looked from the yard like a simple path soon divided beneath the trees, and one of them suggested a narrower track that appeared to cut across the slope.`,`It did not. The path curved away from the wayhouse, disappeared behind a line of wet brush and eventually left them standing beside a stream that was nowhere on the map. They spent the next hour finding their way back, collecting what herbs they could along the way and becoming progressively muddier as the ground softened beneath their boots.`,`By the time they returned, the others had already finished most of the work. Their bundle of herbs looked unimpressive beside everyone else’s, and neither could say with confidence who had first decided the route was a shortcut. The embarrassment lasted only until they began describing how many times they had passed the same fallen tree without noticing. Before long, the failed errand had become funny enough that the details grew slightly more ridiculous each time it was retold.`],
5:[`Meals at the wayhouse were usually communal, with whoever had free hands helping in the kitchen. One evening, one of the travellers volunteered to prepare a stew and did so with much more confidence than experience. The result looked respectable enough in the pot. It smelled reasonably good. That was where its strengths ended.`,`The other traveller managed several bites before their expression became impossible to hide. The stew was somehow too sweet, too heavily peppered and faintly burnt all at once. When the cook finally noticed, there was a brief attempt to insist that nothing was wrong before the truth became obvious. The embarrassment could have lingered, but instead both began laughing at how long politeness had kept the bowl moving toward empty.`,`They abandoned the stew and ate bread, cheese and leftovers from breakfast with everyone else. By the end of the meal, the failed dinner had already become a shared joke. Something about the evening made it easier to stop trying quite so hard to seem impressive around each other. The wayhouse had enough people pretending to know what they were doing. Neither felt much need to add to the number.`],
6:[`Nothing particularly important happened the following day. One traveller spent most of the morning helping repair part of the stable roof while the other went into the nearby settlement with several members of the group. Their paths crossed only briefly at breakfast and once again in the afternoon when supplies were carried through the common room.`,`At dinner they sat at different ends of the table. Conversation moved around the room in several directions at once, and they spoke mostly to the people nearest them. At one point somebody told a story that made half the table laugh. The two travellers happened to look across the room at the same moment and caught each other’s reaction before turning back to the conversation around them.`,`By the time everyone settled for the night, they had probably exchanged fewer than ten words. It did not make the day feel strange. They were still only loosely familiar, still surrounded by other friends and other concerns. Yet the other person had become recognisable enough to be noticed even from across a crowded room.`],
7:[`The road remained closed, and the keeper continued discovering work for his temporary guests. That morning the two travellers were assigned to clean the common room. They began with the practical question of who would sweep and who would deal with the fireplace, then somehow spent the next hour discussing which household chores were objectively worst.`,`The work moved in fits and starts. A half-finished thought led to a story about an inn somewhere south; that story led to a complaint about washing clothes on the road; the complaint turned into a debate about whether folding anything was worthwhile when it would only be packed again. By the time the floor was clean, both had learned an unreasonable amount about the other’s opinions on entirely ordinary things.`,`The room took longer to finish than it should have. Neither seemed bothered. When the keeper returned, the furniture had been put back in place and the fireplace was finally clean, but the two travellers were still talking as they carried the last bucket outside. Being paired together had begun to feel less like an assignment and more like a convenient excuse to continue a conversation.`],
8:[`After days of rain, the weather changed completely. The hills brightened under a clear sky, and tiny flowers appeared in places that had been mud only a few mornings earlier. The two travellers were sent to the stream with empty buckets and finished filling them quickly.`,`On the way back, movement beyond the trees caught their attention. A meadow beside the path had filled with butterflies. Some rested among the new flowers while others moved above the grass in loose clouds, bright whenever the sunlight caught their wings. The travellers set the buckets down intending to stop for only a moment. Instead, they sat near the edge of the field and stayed.`,`They talked without trying to make the conversation important. They traded stories about places they had travelled through, people they had met, roads they hated and places they hoped to see someday. The conversation wandered as easily as the butterflies did, and neither paid much attention to how long they had been gone.`,`Someone eventually came looking for them because the wayhouse still needed water. They returned carrying the original buckets and a mild amount of embarrassment, but the delay did not feel wasted. Later, both remembered the field more clearly than anything they had actually said there.`],
9:[`One evening, one traveller asked about a long scratch across the other’s boot. It should have taken a sentence to explain. Instead, the answer began several towns earlier and involved an elderly baker, a market, a neighbour’s horse and several people whose names had no obvious connection to the damaged leather.`,`The listener found the wandering explanation funny at first. Then, somewhere between the second unnecessary detour and the eventual return to the original question, they realised they were genuinely enjoying it. The story did not need to be efficient. The details were part of the pleasure because they revealed the way the other traveller remembered things: not as neat events, but as whole places filled with people, small observations and side roads.`,`By the end, the scratch had finally been explained, though the listener had nearly forgotten to care about it. What stayed with them instead were the unnecessary pieces—the horse, the baker, the market stall and the way the storyteller became more animated whenever another memory occurred to them. It was the first time the listener noticed just how much the other traveller enjoyed telling stories about the life they had lived.`],
10:[`The following evening, the usual storyteller was quieter. They ate with the group, helped clear the table and spent most of the night repairing a glove near the window. Nothing appeared wrong; there simply happened to be no story waiting to spill into the room.`,`The other traveller noticed the difference more than expected. After some time, they asked about one of the minor details from the previous night—the neighbour’s horse that had appeared in the long explanation and then vanished before the end. The question was small, but it was enough. The storyteller looked up, remembered where that thread of the tale had gone and began explaining.`,`Another long account followed, branching into places that had nothing to do with the original question. This time the listener had known exactly what they were inviting. They put aside what they were doing and listened until the story was finished. What had begun as patience a few days earlier was turning into something more deliberate: a genuine fondness for hearing the other person talk, even when the subject mattered very little.`],
11:[`Someone in the travelling party owned a simple game played with a handful of coloured stones. The rules were easy enough that nearly everyone understood them within a few minutes. The two travellers managed to make them complicated almost immediately.`,`A disagreement over scoring became a new rule. The new rule created another problem, so they added a second one. By the time the others abandoned the game, the pair had invented enough exceptions that nobody else could follow what was happening. A blue stone became attached to one particularly ridiculous mistake, and for reasons neither could later explain properly, it remained funny long after the game had ended.`,`The next morning, one traveller found the blue stone beside their breakfast bowl. They laughed before looking across the room. Someone nearby asked what it meant, but there was no useful answer. It had become one of those small things whose meaning depended entirely on having been there. From then on, the stone occasionally appeared in strange places—a pocket, a windowsill, beside a cup—and always produced the same reaction from exactly two people.`],
12:[`By the middle of the month, the travelling party had developed routines without discussing them. People tended to sit in the same places at meals, gather with the same companions in the evenings and leave their belongings in the same corners of the room.`,`One night, somebody else took the seat that had quietly become the usual place beside one of the travellers. There were plenty of other chairs, and no one had any reason to think the arrangement mattered. The other traveller sat across the table instead.`,`Dinner continued normally. Yet several times, one of them turned toward the familiar space beside them before remembering that someone else was there. Across the table, the same small mistake happened in reverse. Neither mentioned it, and neither made anything of it afterward.`,`The following evening, the chair was empty again. The other traveller sat there naturally, as though nothing had interrupted the pattern. By then, each had begun to occupy a small expected place in the other’s day.`],
13:[`A messenger reached the wayhouse around midday carrying several letters for people delayed by the storm. Most were opened immediately. News from home was passed around the room, and one traveller read part of a letter aloud to anyone willing to listen.`,`The other traveller recognised the handwriting on their envelope before their name was called. The change in them was small but noticeable. They turned the letter over once, slipped it unopened into their bag and spent the afternoon outside helping repair a fence that did not urgently need attention.`,`The second traveller noticed and nearly asked about it. Instead, they carried another bundle of timber outside and worked nearby. For a while they spoke very little. Eventually the conversation moved toward easier things—the crooked fence, the weather, whether the road crew would finish before the next rain—and the tension around the unopened letter faded without being forced away.`,`The envelope remained sealed that night. Whatever was written inside belonged to the person carrying it until they chose otherwise.`],
14:[`During breakfast, one traveller reached for something across the table and knocked a cup onto the floor. It shattered against the boards. The accident was small, but their reaction was immediate and much larger than the damage. They apologised several times, began gathering the pieces with bare hands and worried aloud about replacing it before anyone had even asked.`,`The other traveller stopped them from picking up the sharpest fragments and fetched a broom. The wayhouse keeper, when told, barely looked up from the pantry. There were more cups on the shelf, and the broken one had already been chipped.`,`The matter ended there for everyone else. The traveller who had broken it remained embarrassed for a little longer, not because of the cup but because of how quickly fear had appeared over something so harmless. The other traveller did not tease them or ask what had caused the reaction. They simply helped clean the floor and allowed the moment to pass.`,`Later, they spent the afternoon as usual. The cup was gone, but the brief glimpse of an older habit remained quietly in memory.`],
15:[`Another leak appeared in the roof, forcing several people to move their belongings away from one side of the common room. While carrying packs upstairs, one traveller accidentally knocked over the other’s bag. Something heavy inside shifted and struck the floor with a dull metallic sound.`,`They crouched to help, but the owner reached the bag first and pulled it close. The movement was quick enough to make both pause. Only then did the other traveller notice a small lock fixed through one of the straps, worn from use but carefully kept.`,`No explanation followed. The bag was lifted, carried upstairs and placed beside the rest of the belongings. The person who had knocked it over did not ask what was inside or why it needed to be locked.`,`Later that evening, the owner of the bag brought two cups of tea to the window where the other traveller was sitting. They spoke about the road and the people likely to leave first once it reopened. Whatever had been inside the bag stayed there. The ease between them returned without requiring access to everything the other person carried.`],
16:[`With the road repairs finally making progress, maps began appearing on the tables again. People compared routes and argued about which bridges would still be usable after the storm. While looking over one traveller’s map, the other noticed several destinations that had been crossed out so heavily that the parchment beneath them was nearly torn.`,`One road in particular had been scratched over again and again until the ink formed a dark knot. The question that followed was casual—whether those had simply been bad roads. The owner of the map gave an equally casual answer that explained almost nothing, then folded that section away.`,`The conversation moved on to a mountain crossing farther north, where someone had heard of a bridge that swayed badly in high wind. The travellers spent the next part of the afternoon deciding whether that made the route more interesting or merely foolish.`,`The damaged places on the map were not mentioned again. The other traveller had seen enough to understand that not every road behind someone needed to be retraced in order to keep walking beside them.`],
17:[`A smaller storm passed over the wayhouse during the night. The wind was strong enough to rattle the shutters and wake several people, though the roof held this time. One traveller came downstairs and found the other sitting near the cold fireplace, awake long after everyone else had gone back to sleep.`,`They did not ask why. They sat nearby and listened to the rain strike the windows. For several minutes neither spoke at all. Eventually the silence gave way to ordinary conversation: complaints about the useless fireplace, guesses about whether the roof would survive another week, and a half-finished story that had nothing to do with the hour.`,`Nothing was solved before they returned upstairs. No explanation was offered for the sleeplessness, and none was requested. The storm simply became something they waited through in the same room.`,`By morning, sunlight had begun pushing through the clouds. The night left no dramatic change behind, only the quiet knowledge that one person had found the other awake and had chosen to stay for a while.`],
18:[`The day after the storm was unexpectedly warm. In the afternoon, the two travellers returned to the meadow beside the stream. There were fewer butterflies than before, but enough remained to move between the flowers whenever the grass stirred.`,`They spent an unreasonable amount of time trying to convince one to land on an outstretched hand. Every attempt failed. The butterflies seemed perfectly willing to settle on grass, stones and flowers, but not on either traveller. The failure became increasingly funny as their methods grew less dignified.`,`They eventually gave up and lay in the grass instead. The night before was not discussed. Neither mentioned the unopened letter, the locked bag or the marked-out places on the map. Those things still existed, but they did not have to become the subject of every good afternoon.`,`When they returned to the wayhouse, one of the butterflies followed the path for a short distance before turning back toward the field. The travellers watched it disappear and continued home in a better mood than either had started with.`],
19:[`One traveller woke earlier than everyone else and went downstairs while the wayhouse was still quiet. They started the kettle, prepared their usual tea and, without thinking much about it, reached for a second cup.`,`Only after both cups were finished did they notice what they had done. The second had been prepared with less sugar and a little more milk, exactly the way the other traveller had taken it every morning for the past week. There was no particular reason to undo the mistake, so the cup was left beside the familiar chair.`,`When the other traveller eventually appeared, half-awake and moving slowly, they noticed the tea and accepted it without ceremony. The morning continued. People came downstairs, breakfast was prepared, and the common room grew noisy.`,`Neither mentioned that the cup had been made automatically. By then, small details about the other person had begun settling into habit before either of them had consciously decided they were worth remembering.`],
20:[`One traveller went into the nearby village alone to collect supplies. Near the market gate, a merchant had arranged small carved animals across a table. Most were neatly made. One bird was not. Its wings were uneven, its beak pointed slightly sideways and its expression made it look permanently offended.`,`The traveller stopped because they could immediately imagine the other person laughing at it. The thought arrived before any decision to buy the thing. After a brief argument with the merchant over a price that seemed generous for such a badly carved bird, the traveller gave in and carried it back to the wayhouse.`,`The little carving was left beside the other traveller’s belongings without much explanation. When it was found, the reaction was exactly what had been expected. The bird was admired for all the reasons a better-made object would have been rejected.`,`It ended up on the windowsill beside the bed. For the first time, one traveller had carried something through part of a day simply because it had reminded them of the other.`],
21:[`One afternoon, one traveller sat near the doorway repairing a tear in a boot while the other told another long story. The account involved a collapsed bridge, several merchants and, for reasons that took a while to become clear, a goat.`,`The repair should have been simple. Instead, the needle repeatedly stopped because the listener kept looking up to ask questions. Each answer created another branch in the story, and each branch seemed to require its own history before anything could move forward.`,`By the time the boot was finally repaired, nearly twice as much time had passed as the work required. The storyteller had still not reached the collapsed bridge. Neither seemed frustrated by this. Conversation no longer felt like an activity that needed to be arranged separately from the rest of the day. It had begun fitting itself around whatever else they were doing.`,`The repaired boot was set aside, and the listener stayed where they were until the story eventually found its way to an ending.`],
22:[`The weather stayed warm enough for several people to spend the afternoon outside. The two travellers found shade beneath an old tree near the edge of the property. One brought a book. The other brought paper and charcoal.`,`For nearly two hours, they did separate things. The reader turned pages while the other sketched whatever happened to be nearby: the fence, the shape of the roof, a sleeping horse in the distance. Every so often one of them would show the other something—a sentence, a poor drawing, a beetle moving through the grass—then return to what they had been doing.`,`There was no pressure to keep the silence filled. It felt different from the awkward quiet of people who had run out of things to say. The other person’s presence had become comfortable enough that neither needed to perform for it.`,`When the sun moved and the tree no longer provided shade, both looked up with surprise. The afternoon had passed almost unnoticed.`],
23:[`That evening, the storyteller began recounting an adventure from several years earlier. Partway through, the listener realised they had heard it before. In fact, they had heard it twice.`,`The discovery embarrassed the storyteller more than expected. They began to stop, assuming there was no reason to continue a story whose ending was already known. The listener, however, remembered several details that had changed between the previous versions and asked about one of them. The interruption was enough to keep the story moving.`,`Very little about the third telling was new. The same people appeared, the same problem occurred, and the same ending arrived eventually. Yet the listener found themselves enjoying the familiar rhythm of it. They knew which part would be exaggerated, where another side story would appear and which detail would be forgotten until the end.`,`The story itself had stopped being the only interesting thing. The person telling it had become reason enough to listen.`],
24:[`Near the end of the week, the wayhouse keeper stood in the common room and remarked that the building had not looked this good in years. Nobody had intended to renovate it. The improvements had simply accumulated around them while everyone waited for the road.`,`The shutters closed properly now. The old lantern by the door worked each night. A crooked chair had been repaired, the kitchen shelves had been reorganised, and a bottle filled with flowers from the meadow sat on one of the tables. Even the corner where the roof had leaked on the first night was dry.`,`The two travellers looked around and realised it was difficult to remember exactly when the building had stopped feeling temporary. No single repair had transformed it. The place had become comfortable through dozens of small acts performed because there had been time and because people had been there to do them.`,`Their own familiarity had developed in much the same way, though neither gave it that name. There had been no single day when the other person suddenly mattered. Enough ordinary days had simply gathered together.`],
25:[`A rider arrived shortly before lunch with news from the road crew. The bridge had been repaired, and only a few final sections of the road still needed clearing. If the weather held, everyone would be able to continue within two days.`,`The common room erupted into excitement. Maps came out again, supplies were counted and people began discussing the first meals they would eat once they reached larger towns. The two travellers joined in easily. Both had been waiting for the road to open since the night they arrived.`,`Later, one of them walked down toward the bridge to see the work for themselves. The other joined them before long. From the roadside they watched workers carry the final timber into place and clear mud from the approach.`,`For weeks, the broken road had decided where everyone stayed and who remained together. Now that reason was almost gone. The thought did not make either traveller unhappy exactly, but it lingered longer than either expected as they walked back to the wayhouse.`],
26:[`Packing began the following morning. Rooms that had slowly become lived-in returned to their original emptiness as blankets were rolled, food was divided and small belongings disappeared into travelling bags.`,`While securing the bedroll to one pack, a traveller noticed the brass hook from the strange trade earlier in the month. It was scratched now but still holding perfectly. Across the room, the other traveller was checking the silver compass and comparing it with the map.`,`For a moment, trading the objects back seemed like the obvious way to undo an exchange that had never made financial sense. The idea was mentioned, considered and quietly dismissed. The compass worked. The hook worked. Both had already become associated with the people carrying them.`,`When the bags were finally closed, the hook remained on one pack and the compass disappeared into the other. A small decision made out of necessity weeks earlier had lasted long enough to become part of the journey itself.`],
27:[`Maps covered nearly every table that evening. People traced routes with their fingers, compared distances and decided where the travelling party would begin breaking apart after leaving the wayhouse.`,`The two travellers laid their own maps beside each other. One eventually needed to go west toward the lowlands. The other was heading east. Their routes overlapped for a while, then separated beyond the hills. This was not a surprise. They had been travelling toward different places before the storm ever put them under the same roof.`,`They planned to share the part of the road that made sense for both of them. There was no suggestion that either person should change a destination or abandon a plan. Whatever familiarity had formed between them did not erase the lives that had existed before it.`,`Still, the overlapping portion of the map seemed shorter than it would have a week earlier.`],
28:[`The keeper prepared a large meal for everyone’s final evening at the wayhouse. People stayed at the table long after the food was finished, repeating stories from the past few weeks and reviving arguments that had already become jokes.`,`The coloured stones appeared again. The two travellers attempted to explain the version of the game they had invented, but the rules had become so dependent on old mistakes and private references that nobody else could follow them. The blue stone eventually disappeared into one traveller’s pocket before the game was abandoned.`,`Most of the evening was spent with the entire group. The pair were not tucked away in private conversation, nor did they need to be. Yet whenever something funny happened across the table, each tended to look for the other’s reaction. When a story was told badly, they exchanged the same expression before either said anything.`,`By midnight, the room had begun to empty. The wayhouse felt strangely quiet for a place everyone had spent weeks wanting to leave.`],
29:[`By late morning the next day, the travelling party reached a fork where several of their routes separated. One road bent west toward the lowlands, another continued east through the hills, and a narrower road ran north between them before eventually dividing again farther on.`,`Goodbyes began beneath an old wooden signpost. Some travellers left quickly, eager to make up lost time, while others lingered over maps and last conversations. The two travellers compared their own routes once more. The western road was clearly better for one. The eastern road was clearly better for the other.`,`There was also the road between them. It was longer for both, climbed almost immediately and had enough mud visible from the crossroads to make its condition obvious. According to the map, however, it would keep them on the same route for another few days before reconnecting with both of their intended directions.`,`Neither suggested it at first. There was no practical reason to choose extra distance. Eventually, one of them pointed out that the road did technically go both ways they needed—just not efficiently. The other studied the map for a while, then looked toward the hills. The decision was made without much ceremony. They adjusted their packs, said goodbye to the remaining group and took the middle road together.`],
30:[`The middle road proved to be every bit as inconvenient as it had looked from the crossroads. Within the first hour, one traveller stepped into mud deep enough to soak one boot completely. Not long after that, the other discovered that the path marked on the map had apparently been drawn by someone with a generous imagination, because part of it had disappeared beneath several years of overgrown grass.`,`Neither complained very seriously. They spent most of the morning talking as they walked. The storyteller continued an adventure they had begun explaining days earlier, while the other occasionally asked enough questions to make the story even longer. Progress was slow, but for once neither seemed particularly interested in arriving quickly.`,`Around midday, they stopped beside a stream to eat. The silver compass from the wayhouse lay beside one traveller’s pack, while the little brass hook they had once traded for it was still holding the other traveller’s strap securely in place. Neither had ever suggested exchanging them back.`,`After lunch, they continued north. From the top of a hill they could see the two easier roads running far below them on opposite sides of the valley. One would have carried each traveller toward their destination faster. Neither reconsidered.`,`There had been no promise made at the crossroads, and neither had asked for one. They did not know how long the shared road would last or what waited beyond the hills. For now, it was enough that when the storm no longer decided where they stood, they had chosen a road that gave them a little more time.`]

const DATE_LOCK_ENABLED=false;const YEAR=2026;const grid=document.getElementById('dayGrid'),overlay=document.getElementById('overlay'),closeBtn=document.getElementById('close'),right=document.getElementById('right'),story=document.getElementById('story'),pageBack=document.getElementById('pageBack'),pageCount=document.getElementById('pageCount'),hint=document.getElementById('hint'),pageFill=document.getElementById('pageFill'),entry=document.getElementById('entry'),date=document.getElementById('date');let activeDay=null,pages=[],pageIndex=0,timer=null;function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}function unlocked(d){return !DATE_LOCK_ENABLED||new Date(YEAR,8,d)<=today()}function budget(){if(innerWidth<=390)return 760;if(innerWidth<=720)return 900;return 1120}function paginate(paragraphs){const b=budget(),out=[];let cur=[],count=0;paragraphs.forEach(p=>{if(cur.length&&count+p.length>b){out.push(cur);cur=[];count=0}cur.push(p);count+=p.length});if(cur.length)out.push(cur);return out.length?out:[[]]}function render(){story.innerHTML=(pages[pageIndex]||[]).map(p=>`<p>${p}</p>`).join('');pageCount.textContent=`${pageIndex+1} / ${pages.length}`;hint.textContent=pageIndex<pages.length-1?'tap the page →':'end.';pageBack.classList.toggle('show',pageIndex>0);pageFill.style.width=`${((pageIndex+1)/pages.length)*100}%`}function openStory(d){activeDay=d;pages=paginate(STORIES[d]||[]);pageIndex=0;entry.textContent=`entry ${String(d).padStart(2,'0')}`;date.textContent=`sep. ${d}.`;render();overlay.classList.add('show');overlay.setAttribute('aria-hidden','false');document.body.classList.add('book-open')}function closeStory(){overlay.classList.remove('show');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('book-open');activeDay=null}function turn(i){if(i<0||i>=pages.length||i===pageIndex)return;right.classList.add('turning');clearTimeout(timer);timer=setTimeout(()=>{pageIndex=i;render();right.classList.remove('turning')},135)}for(let d=1;d<=30;d++){const b=document.createElement('button');b.type='button';b.className='day-card';b.innerHTML=`<small>september</small><span>${String(d).padStart(2,'0')}</span>`;if(!unlocked(d)){b.disabled=true;b.classList.add('locked')}else b.addEventListener('click',()=>openStory(d));grid.appendChild(b)}right.addEventListener('click',e=>{if(e.target.closest('#pageBack'))return;if(pageIndex<pages.length-1)turn(pageIndex+1)});pageBack.addEventListener('click',e=>{e.stopPropagation();turn(pageIndex-1)});closeBtn.addEventListener('click',closeStory);overlay.addEventListener('click',e=>{if(e.target===overlay)closeStory()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('show'))return;if(e.key==='Escape')closeStory();if(e.key==='ArrowRight'&&pageIndex<pages.length-1)turn(pageIndex+1);if(e.key==='ArrowLeft'&&pageIndex>0)turn(pageIndex-1)});let sx=null;right.addEventListener('touchstart',e=>{sx=e.touches[0]?.clientX??null},{passive:true});right.addEventListener('touchend',e=>{if(sx===null)return;const dx=(e.changedTouches[0]?.clientX??sx)-sx;if(Math.abs(dx)>44){if(dx<0&&pageIndex<pages.length-1)turn(pageIndex+1);if(dx>0&&pageIndex>0)turn(pageIndex-1)}sx=null},{passive:true});let rt=null;addEventListener('resize',()=>{if(!activeDay)return;clearTimeout(rt);rt=setTimeout(()=>{pages=paginate(STORIES[activeDay]||[]);pageIndex=Math.min(pageIndex,pages.length-1);render()},120)});
