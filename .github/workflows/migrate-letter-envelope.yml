name: Migrate global letter envelope

on:
  push:
    paths:
      - 'letter-envelope.js'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace old envelope script reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('index.html', 'mailbox.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('src="aug01-envelope.js"', 'src="letter-envelope.js"')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- index.html mailbox.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mailbox.html
          git commit -m "Use global letter envelope animation"
          git push
