name: Inject Aug 01 envelope prototype

on:
  push:
    paths:
      - 'aug01-envelope.js'

permissions:
  contents: write

jobs:
  patch-mailbox-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Hook prototype into mailbox pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = '  <script src="aug01-envelope.js"></script>\n'
          for name in ('index.html', 'mailbox.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'src="aug01-envelope.js"' not in text:
                  text = text.replace('</body>', hook + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit prototype hook
        shell: bash
        run: |
          if git diff --quiet -- index.html mailbox.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mailbox.html
          git commit -m "Hook Aug 01 envelope prototype into mailbox"
          git push
